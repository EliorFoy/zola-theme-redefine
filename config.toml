# Zola 站点配置 —— hexo-theme-redefine 的 Zola 迁移版
# 主题文档：themes/redefine/README.md（迁移映射与差异说明）

base_url = "http://127.0.0.1:1111"
title = "Theme Redefine"
description = "Redefine Your Zola Journey."
default_language = "zh"
theme = "redefine"
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

taxonomies = [
  { name = "tags", render = true },
  { name = "categories", render = true },
]

[markdown]
# 语法高亮：等价于原主题 articles.code_block.highlight_theme.light/dark
# 可选主题见 https://github.com/getzola/giallo（github-light / dark-plus / one-dark-pro ...）
[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "dark-plus"

[search]
index_format = "fuse_json"
include_title = true
include_content = true

