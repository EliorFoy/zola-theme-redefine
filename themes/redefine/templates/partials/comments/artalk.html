{% set rd = config.extra.redefine %}
{% set ac = rd.comment.config.artalk %}
{% if rd.comment.system == "artalk" and ac.server and ac.site %}
  <div id="artalk-comment"></div>
  <script {% if rd.global.single_page %}data-swup-reload-script{% endif %}>
    (function() {
      const startPath = location.pathname;
      const startTime = Date.now();
      const retryDelay = 200;
      const retryLimit = 5000;
      const isSinglePage = {{ rd.global.single_page | json_encode | safe }};
      const artalkServer = {{ ac.server | json_encode | safe }};
      const artalkSite = {{ ac.site | json_encode | safe }};

      const ensureCss = () => {
        if (document.getElementById("artalk-css")) return;
        const link = document.createElement("link");
        link.id = "artalk-css";
        link.rel = "stylesheet";
        link.href = "https://cdn.jsdelivr.net/npm/artalk/dist/Artalk.css";
        document.head.appendChild(link);
      };

      const ensureScript = () => {
        if (document.getElementById("artalk-script")) return;
        const script = document.createElement("script");
        script.id = "artalk-script";
        script.src = "https://cdn.jsdelivr.net/npm/artalk/dist/Artalk.js";
        script.async = true;
        document.body.appendChild(script);
      };

      const initArtalk = () => {
        if (!window.Artalk) return false;
        ensureCss();
        try {
          window.__artalk_instance && window.__artalk_instance.destroy?.();
        } catch (e) {}
        window.__artalk_instance = Artalk.init({
          el: "#artalk-comment",
          server: artalkServer,
          site: artalkSite,
        });
        return true;
      };

      const runArtalk = () => {
        if (location.pathname !== startPath) return;
        const container = document.getElementById("artalk-comment");
        if (!container) {
          if (Date.now() - startTime < retryLimit) setTimeout(runArtalk, retryDelay);
          return;
        }
        if (initArtalk()) return;
        ensureScript();
        if (Date.now() - startTime < retryLimit) setTimeout(runArtalk, retryDelay);
      };

      if (isSinglePage) {
        const t = setTimeout(() => { runArtalk(); clearTimeout(t); }, 1000);
      } else {
        document.addEventListener("DOMContentLoaded", runArtalk);
      }
    })();
  </script>
{% endif %}
