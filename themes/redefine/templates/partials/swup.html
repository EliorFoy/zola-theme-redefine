{% set rd = config.extra.redefine %}
<script src="{{ get_url(path='js/build/libs/Swup.min.js') }}"></script>
<script src="{{ get_url(path='js/build/libs/SwupSlideTheme.min.js') }}"></script>
<script src="{{ get_url(path='js/build/libs/SwupScriptsPlugin.min.js') }}"></script>
<script src="{{ get_url(path='js/build/libs/SwupProgressPlugin.min.js') }}"></script>
<script src="{{ get_url(path='js/build/libs/SwupScrollPlugin.min.js') }}"></script>
<script src="{{ get_url(path='js/build/libs/SwupPreloadPlugin.min.js') }}"></script>
<script>
    window.swup = new Swup({
        plugins: [
            new SwupScriptsPlugin({
                optin: true,
            }),
            new SwupProgressPlugin(),
            new SwupScrollPlugin({
                offset: 80,
            }),
            new SwupSlideTheme({
                mainElement: ".main-content-body",
            }),
            new SwupPreloadPlugin(),
        ],
        containers: ["#swup"],
    });

    window.dispatchEvent(
        new CustomEvent("redefine:swup:ready", {
            detail: {
                swup: window.swup,
            },
        }),
    );
</script>
