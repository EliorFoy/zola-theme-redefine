{% component folding(title: string = "展开", class: string = "", open: bool = false) %}
{# 折叠模块（对应原 {% folding %} 标签插件）
   内容中用法：{% <folding title="点开查看"> %} 内容 {% </folding> %} #}
<details class="relative my-4 border border-border-color bg-second-background-color rounded-md {{ class }}"{% if open %} open{% endif %} data-header-exclude>
  <summary class="px-4 py-2 rounded-md shadow-[0_0_2px_0_var(--shadow-color-1)] cursor-pointer not-markdown"><i class="fa-solid fa-chevron-right"></i>{{ title }} </summary>
  <div class="content p-4">{% if body %}{{ body | markdown | safe }}{% endif %}</div>
</details>
{% endcomponent folding %}
